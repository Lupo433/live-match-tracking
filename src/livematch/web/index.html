<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Match Tracking</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="live-dot" id="liveDot"></span>
      <span class="brand-name">LIVE MATCH <b>TRACKING</b></span>
    </div>
    <div class="scoreboard">
      <span class="team home" id="homeName">Home</span>
      <span class="score" id="score">0 – 0</span>
      <span class="team away" id="awayName">Away</span>
      <span class="clock" id="clock">00:00</span>
      <span class="period" id="period">1T</span>
    </div>
    <select id="matchSelect" aria-label="Partita"></select>
  </header>

  <main class="layout">
    <section class="pitch-wrap">
      <div class="pitch-card">
        <canvas id="pitch" aria-label="Campo da calcio con le posizioni dei giocatori"></canvas>
        <div class="overlay-toggles">
          <label><input type="checkbox" id="togglePC"> Pitch control</label>
          <label><input type="checkbox" id="toggleShape" checked> Forma squadra</label>
          <label><input type="checkbox" id="toggleTrail" checked> Scia palla</label>
        </div>
        <div class="sync" id="syncBadge" hidden>Sincronizzo statistiche… <span id="syncPct">0%</span></div>
        <div class="loading" id="loading">Caricamento partita…</div>
      </div>

      <div class="controls">
        <button id="playBtn" class="btn primary" title="Play/Pausa (spazio)">▶</button>
        <div class="speeds" id="speeds"></div>
        <div class="timeline" id="timeline" title="Clicca per spostarti nella partita">
          <div class="timeline-track">
            <div class="timeline-half" id="halfMarker"></div>
            <div class="timeline-progress" id="progress"></div>
            <div class="timeline-events" id="timelineEvents"></div>
            <div class="timeline-head" id="head"></div>
          </div>
        </div>
        <span class="time-label" id="timeLabel">00:00</span>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="card">
        <h3>Possesso</h3>
        <div class="dual-bar"><div class="home" id="possHome"></div><div class="away" id="possAway"></div></div>
        <div class="dual-labels"><span id="possHomeLbl">50%</span><span id="possAwayLbl">50%</span></div>
        <h3>Pitch control</h3>
        <div class="dual-bar"><div class="home" id="pcHome"></div><div class="away" id="pcAway"></div></div>
        <div class="dual-labels"><span id="pcHomeLbl">50%</span><span id="pcAwayLbl">50%</span></div>
      </div>
      <div class="card kpis" id="teamKpis"></div>
      <div class="card">
        <div class="card-head">
          <h3>Giocatori</h3>
          <div class="tabs" id="teamTabs">
            <button data-team="home" class="active">Home</button>
            <button data-team="away">Away</button>
          </div>
        </div>
        <table class="players" id="playersTable">
          <thead><tr>
            <th data-sort="num">#</th>
            <th data-sort="dist" class="sorted">Dist (km)</th>
            <th data-sort="v">Vel</th>
            <th data-sort="vmax">Max</th>
            <th data-sort="spr">Sprint</th>
            <th data-sort="hi">HI (m)</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <p class="hint">Clicca un giocatore (in tabella o sul campo) per la sua heatmap.</p>
      </div>
      <div class="card" id="heatCard" hidden>
        <div class="card-head"><h3 id="heatTitle">Heatmap</h3><button class="link" id="heatClose">✕</button></div>
        <canvas id="heatmap"></canvas>
      </div>
      <div class="card">
        <h3>Eventi</h3>
        <ul class="feed" id="feed"></ul>
      </div>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
